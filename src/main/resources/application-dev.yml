spring:
  application:
    name: amenicsystem

  datasource:
    url: ${DB_URL_DEV}
    username: ${DB_USER_DEV}
    password: ${DB_PASS_DEV}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST_DEV}
      port: ${REDIS_PORT_DEV}

jwt:
  secret: ${JWT_SECRET_DEV}
  expiration-minutes: 15

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
server:
  port: 8081

mercado-pago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN_DEV}
  public-key: ${MERCADOPAGO_PUBLIC_KEY_DEV}
  webhook-secret: ${MERCADOPAGO_SECRET_KEY_WEBHOOK_DEV}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL_DEV}
  back-url:
    success: ${MERCADOPAGO_BACK_URL_SUCCESS_DEV}
    pending: ${MERCADOPAGO_BACK_URL_PENDING_DEV}
    fail: ${MERCADOPAGO_BACK_URL_FAIL_DEV}

